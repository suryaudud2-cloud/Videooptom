- name: Upload debug APK
  uses: actions/upload-artifact@v4
  with:
    name: debug-apk
    path: TikOptimizeAndroid/app/build/outputs/apk/debug/app-debug.apk

- name: Upload release APK
  uses: actions/upload-artifact@v4
  with:
    name: release-apk
    path: TikOptimizeAndroid/app/build/outputs/apk/release/app-release-unsigned.apk
  continue-on-error: true

- name: Upload build logs on failure
  if: failure()
  uses: actions/upload-artifact@v4
  with:
    name: build-logs
    path: TikOptimizeAndroid/build/reports/
