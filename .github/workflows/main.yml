name: Build Android APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
      
      - name: Make gradlew executable
        run: chmod +x ./TikOptimizeAndroid/gradlew
      
      - name: Build debug APK
        run: |
          cd TikOptimizeAndroid
          ./gradlew assembleDebug
      
      - name: Upload debug APK
        uses: actions/upload-artifact@v3
        with:
          name: debug-apk
          path: TikOptimizeAndroid/app/build/outputs/apk/debug/app-debug.apk
      
      - name: Build release APK (unsigned)
        run: |
          cd TikOptimizeAndroid
          ./gradlew assembleRelease
        continue-on-error: true
      
      - name: Upload release APK
        uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: TikOptimizeAndroid/app/build/outputs/apk/release/app-release-unsigned.apk
        continue-on-error: true
      
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: build-logs
          path: TikOptimizeAndroid/build/reports/
